name: PiNative
options:
  bundleIdPrefix: com.pi.desktop
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.7.4"
    CURRENT_PROJECT_VERSION: "6"

targets:
  PiNative:
    type: application
    platform: macOS
    sources:
      - path: PiNative
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: Pi
        PRODUCT_MODULE_NAME: Pi
        INFOPLIST_FILE: PiNative/Info.plist
        CODE_SIGN_ENTITLEMENTS: PiNative/PiNative.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.pi.desktop.native
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  PiNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PiNativeTests
    dependencies:
      - target: PiNative
    settings:
      base:
        PRODUCT_NAME: PiNativeTests
        PRODUCT_MODULE_NAME: PiNativeTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pi.app/Contents/MacOS/Pi"
        BUNDLE_LOADER: "$(TEST_HOST)"
